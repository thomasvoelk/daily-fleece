name: daily-fleece-e2e

services:
  mongodb:
    image: mongo:8.3
    ports:
      - '${E2E_MONGODB_PORT:-27018}:27017'
    environment:
      MONGO_INITDB_DATABASE: daily_fleece_e2e
      GLIBC_TUNABLES: glibc.cpu.hwcaps=-SHSTK
    volumes:
      - type: tmpfs
        target: /data/db
      - ./src/main/resources/db/migration/V1__init.js:/docker-entrypoint-initdb.d/01_init.js:ro
