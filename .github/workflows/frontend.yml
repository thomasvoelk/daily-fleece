name: Frontend CI

on:
  push:
    branches-ignore:
      - 'renovate/**'
    paths:
      - 'frontend/**'
      - 'api/**'

  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm run test:ci
        working-directory: frontend
