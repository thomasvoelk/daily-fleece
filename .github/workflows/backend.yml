name: Backend CI

on:
  push:
    branches-ignore:
      - 'renovate/**'  
    paths:
      - 'backend/**'
      - 'api/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'api/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify
        run: mvn -B verify
        working-directory: backend
