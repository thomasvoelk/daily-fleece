pre-commit:
  commands:
    backend-format:
      glob:
        - "backend/**/*.java"
        - "backend/**/*.xml"
      run: cd backend && ./mvnw spotless:apply
      stage_fixed: true
    prettier:
      glob:
        - "frontend/src/**/*.{ts,html,json}"
        - "api/**/*.yaml"
        - "backend/src/**/*.{yaml,yml}"
      exclude: "frontend/src/app/backend-client/**"
      run: frontend/node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true
    frontend-lint:
      glob:
        - "frontend/src/**/*.{ts,html}"
      exclude: "frontend/src/app/backend-client/**"
      run: cd frontend && npm run lint
