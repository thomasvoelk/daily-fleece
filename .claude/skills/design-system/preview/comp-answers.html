<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
<style>
  body { margin: 0; background: var(--cream); }
  .wrap { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--paper); border-radius: var(--r-md); border: 2px solid var(--wool-line);
    font-family: var(--font-body); font-weight: 700; font-size: 15px; color: var(--plum);
  }
  .key { width: 28px; height: 28px; flex-shrink:0; border-radius: 8px; background: var(--cream-deep); display:flex; align-items:center; justify-content:center; font-family: var(--font-pixel); font-size: 10px; color: var(--plum-soft); }
  .ms { font-family:'Material Symbols Rounded'; font-size: 22px; margin-left: auto; }
  .selected { border-color: var(--grape); box-shadow: 0 0 0 3px var(--grape-200); }
  .selected .key { background: var(--grape); color:#fff; }
  .correct { border-color: var(--green); background: var(--green-200); }
  .correct .key { background: var(--green); color:#fff; }
  .correct .ms { color: var(--green-700); }
  .wrong { border-color: var(--coral); background: var(--coral-200); }
  .wrong .key { background: var(--coral); color:#fff; }
  .wrong .ms { color: var(--coral-700); }
</style>
</head>
<body>
<div class="wrap">
  <div class="opt"><span class="key">A</span>The Nile</div>
  <div class="opt selected"><span class="key">B</span>The Amazon</div>
  <div class="opt correct"><span class="key">C</span>The Nile<span class="ms">check_circle</span></div>
  <div class="opt wrong"><span class="key">D</span>The Yangtze<span class="ms">cancel</span></div>
</div>
</body>
</html>
