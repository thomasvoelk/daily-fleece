<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--plum); }
  .wrap { padding: 22px 24px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; gap: 7px; }
  .lbl { font-family: var(--font-pixel); font-size: 7px; color: #8A7FA6; letter-spacing: .06em; }
  .big { font-family: var(--font-pixel); color: var(--marigold); font-size: 30px; line-height: 1; }
  .rank { font-family: var(--font-pixel); color: #fff; font-size: 18px; }
  .timer { font-family: var(--font-pixel); color: var(--coral); font-size: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><span class="lbl">SCORE</span><span class="big">2480</span></div>
  <div class="item"><span class="lbl">RANK</span><span class="rank">#1 PLY</span></div>
  <div class="item"><span class="lbl">STREAK</span><span class="rank" style="color:var(--marigold)">x7</span></div>
  <div class="item"><span class="lbl">TIMER</span><span class="timer">0:08</span></div>
</div>
</body>
</html>
