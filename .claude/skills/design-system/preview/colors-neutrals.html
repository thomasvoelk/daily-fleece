<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-body); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--r-md); overflow: hidden; border: 1.5px solid var(--wool-line); }
  .sw .chip { height: 78px; }
  .sw .meta { padding: 8px 10px 10px; background: var(--paper); }
  .name { font-weight: 800; font-size: 13px; color: var(--plum); }
  .hex { font-family: var(--font-pixel); font-size: 9px; color: var(--plum-faint); margin-top: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FFF3E0"></div><div class="meta"><div class="name">Cream · app bg</div><div class="hex">#FFF3E0</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFBF4"></div><div class="meta"><div class="name">Paper · surface</div><div class="hex">#FFFBF4</div></div></div>
    <div class="sw"><div class="chip" style="background:#F6E7CE"></div><div class="meta"><div class="name">Sunken wool</div><div class="hex">#F6E7CE</div></div></div>
    <div class="sw"><div class="chip" style="background:#241B3A"></div><div class="meta"><div class="name">Plum · ink</div><div class="hex">#241B3A</div></div></div>
    <div class="sw"><div class="chip" style="background:#4A3E66"></div><div class="meta"><div class="name">Plum soft</div><div class="hex">#4A3E66</div></div></div>
    <div class="sw"><div class="chip" style="background:#8A7FA6"></div><div class="meta"><div class="name">Plum faint</div><div class="hex">#8A7FA6</div></div></div>
  </div>
</div>
</body>
</html>
