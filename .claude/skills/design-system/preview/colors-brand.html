<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-body); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow-1); }
  .sw .chip { height: 78px; }
  .sw .meta { padding: 8px 10px 10px; background: var(--paper); }
  .name { font-weight: 800; font-size: 13px; color: var(--plum); }
  .hex { font-family: var(--font-pixel); font-size: 9px; color: var(--plum-faint); margin-top: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#7C3AF0"></div><div class="meta"><div class="name">Grape</div><div class="hex">#7C3AF0</div></div></div>
    <div class="sw"><div class="chip" style="background:#14B8A6"></div><div class="meta"><div class="name">Teal</div><div class="hex">#14B8A6</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFB422"></div><div class="meta"><div class="name">Marigold</div><div class="hex">#FFB422</div></div></div>
    <div class="sw"><div class="chip" style="background:#FF5A5F"></div><div class="meta"><div class="name">Coral</div><div class="hex">#FF5A5F</div></div></div>
    <div class="sw"><div class="chip" style="background:#34C759"></div><div class="meta"><div class="name">Green</div><div class="hex">#34C759</div></div></div>
    <div class="sw"><div class="chip" style="background:#3FA7F0"></div><div class="meta"><div class="name">Sky</div><div class="hex">#3FA7F0</div></div></div>
  </div>
</div>
</body>
</html>
