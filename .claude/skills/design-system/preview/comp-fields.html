<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0">
<style>
  body { margin: 0; background: var(--paper); }
  .wrap { padding: 22px 24px; display: flex; gap: 16px; align-items: flex-start; }
  .field { flex: 1; }
  .mlabel { font-family: var(--font-body); font-weight: 800; font-size: 12px; color: var(--plum-soft); margin-bottom: 6px; display:block; letter-spacing:.02em; }
  .inp {
    display: flex; align-items: center; gap: 10px; background: var(--cream);
    border: 2px solid var(--wool-line); border-radius: var(--r-md); padding: 12px 14px;
  }
  .inp.focus { border-color: var(--grape); background: var(--paper); box-shadow: 0 0 0 3px var(--grape-200); }
  .inp input { border: none; background: transparent; outline: none; font-family: var(--font-body); font-weight: 600; font-size: 15px; color: var(--plum); width: 100%; }
  .ms { font-family:'Material Symbols Rounded'; font-size: 20px; color: var(--plum-faint); }
  .focus .ms { color: var(--grape); }
  .hint { font-size: 11px; color: var(--plum-faint); margin-top: 6px; font-weight:600; }
  .toggle { width: 52px; height: 30px; border-radius: 999px; background: var(--grape); position: relative; }
  .knob { position:absolute; top:3px; left:25px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow: var(--shadow-1); }
  .togwrap { display:flex; align-items:center; gap:10px; padding-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="field">
    <label class="mlabel">Your name</label>
    <div class="inp focus"><span class="ms">badge</span><input value="Priya" /></div>
    <div class="hint">Shown on the leaderboard</div>
  </div>
  <div class="field">
    <label class="mlabel">Team code</label>
    <div class="inp"><span class="ms">tag</span><input placeholder="e.g. FLEECE" /></div>
    <div class="hint">Ask your standup host</div>
  </div>
  <div class="togwrap"><div class="toggle"><div class="knob"></div></div><span class="t-small" style="color:var(--plum)">Daily ping</span></div>
</div>
</body>
</html>
