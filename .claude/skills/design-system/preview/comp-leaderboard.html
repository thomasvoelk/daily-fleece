<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
<style>
  body { margin: 0; background: var(--cream); }
  .wrap { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .lrow { display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: var(--r-md); padding: 12px 16px; box-shadow: var(--shadow-1); }
  .rank { font-family: var(--font-pixel); font-size: 13px; width: 34px; color: var(--plum-faint); }
  .lrow.gold { box-shadow: var(--shadow-2); border: 2px solid var(--marigold); }
  .lrow.gold .rank { color: var(--marigold-700); }
  .av { width: 38px; height: 38px; border-radius: 50%; background: var(--grape-200); display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight:700; color: var(--grape-700); font-size: 15px; }
  .nm { font-family: var(--font-body); font-weight: 800; font-size: 15px; color: var(--plum); }
  .sub { font-size: 11px; color: var(--plum-faint); font-weight:700; }
  .pts { margin-left: auto; font-family: var(--font-pixel); font-size: 13px; color: var(--marigold-700); }
  .ms { font-family:'Material Symbols Rounded'; font-size: 16px; color: var(--marigold); vertical-align: -3px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lrow gold"><span class="rank">1</span><div class="av" style="background:var(--marigold-200);color:var(--marigold-700)">P</div><div><div class="nm">Priya <span class="ms">crown</span></div><div class="sub">x7 streak</div></div><span class="pts">2480</span></div>
  <div class="lrow"><span class="rank">2</span><div class="av">M</div><div><div class="nm">Marco</div><div class="sub">x3 streak</div></div><span class="pts">2210</span></div>
  <div class="lrow"><span class="rank">3</span><div class="av" style="background:var(--teal-200);color:var(--teal-700)">J</div><div><div class="nm">Jess</div><div class="sub">x1 streak</div></div><span class="pts">1990</span></div>
</div>
</body>
</html>
