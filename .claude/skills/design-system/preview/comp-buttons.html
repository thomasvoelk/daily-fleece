<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--cream); }
  .wrap { padding: 26px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-display); font-weight: 600; font-size: 16px;
    border: none; border-radius: var(--r-pill); padding: 13px 26px; cursor: pointer;
    transition: transform var(--dur-fast) var(--ease-bounce), box-shadow var(--dur-fast);
  }
  .btn:active { transform: translateY(5px); }
  .grape { background: var(--grape); color: #fff; box-shadow: var(--chunk-grape); }
  .grape:active { box-shadow: 0 0 0 var(--grape-700); }
  .marigold { background: var(--marigold); color: var(--plum); box-shadow: var(--chunk-marigold); }
  .marigold:active { box-shadow: 0 0 0 var(--marigold-700); }
  .teal { background: var(--teal); color: #fff; box-shadow: var(--chunk-teal); }
  .teal:active { box-shadow: 0 0 0 var(--teal-700); }
  .ghost { background: var(--paper); color: var(--grape); box-shadow: inset 0 0 0 2px var(--grape); }
  .text { background: transparent; color: var(--grape); padding: 13px 14px; }
  .lbl { width:100%; font-family: var(--font-pixel); font-size: 8px; color: var(--plum-faint); margin-bottom: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn grape">Play today</button>
  <button class="btn marigold">Claim points</button>
  <button class="btn teal">Next</button>
  <button class="btn ghost">Skip</button>
  <button class="btn text">Maybe later</button>
</div>
</body>
</html>
