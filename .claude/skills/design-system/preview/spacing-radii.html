<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); }
  .wrap { padding: 24px; display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 64px; background: var(--grape-200); border: 2px solid var(--grape); border-bottom: none; }
  .lbl { font-family: var(--font-pixel); font-size: 8px; color: var(--plum); }
  .val { font-size: 11px; color: var(--plum-faint); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="item"><div class="box" style="border-top-left-radius:10px;border-top-right-radius:10px"></div><div class="lbl">sm</div><div class="val">10px</div></div>
  <div class="item"><div class="box" style="border-top-left-radius:16px;border-top-right-radius:16px"></div><div class="lbl">md</div><div class="val">16px</div></div>
  <div class="item"><div class="box" style="border-top-left-radius:24px;border-top-right-radius:24px"></div><div class="lbl">lg</div><div class="val">24px</div></div>
  <div class="item"><div class="box" style="border-top-left-radius:32px;border-top-right-radius:32px"></div><div class="lbl">xl</div><div class="val">32px</div></div>
  <div class="item"><div class="box" style="border-top-left-radius:999px;border-top-right-radius:999px"></div><div class="lbl">pill</div><div class="val">999px</div></div>
</div>
</body>
</html>
