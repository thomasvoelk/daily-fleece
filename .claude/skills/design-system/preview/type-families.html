<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-body); }
  .wrap { padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; }
  .spec { display: flex; align-items: baseline; gap: 16px; }
  .tag { width: 130px; flex-shrink: 0; }
  .fam { font-weight: 800; font-size: 13px; color: var(--plum); }
  .use { font-size: 11px; color: var(--plum-faint); margin-top: 2px; }
  .samp-fredoka { font-family: var(--font-display); font-weight: 600; font-size: 30px; color: var(--plum); }
  .samp-nunito { font-family: var(--font-body); font-weight: 700; font-size: 26px; color: var(--plum); }
  .samp-pixel { font-family: var(--font-pixel); font-size: 17px; color: var(--grape); }
  hr { border: none; border-top: 1.5px dashed var(--wool-line); margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="spec">
    <div class="tag"><div class="fam">Fredoka</div><div class="use">Display · headings · buttons</div></div>
    <div class="samp-fredoka">Two questions. Daily.</div>
  </div>
  <hr>
  <div class="spec">
    <div class="tag"><div class="fam">Nunito</div><div class="use">Body · questions · UI</div></div>
    <div class="samp-nunito">Which river is the longest?</div>
  </div>
  <hr>
  <div class="spec">
    <div class="tag"><div class="fam">Press Start 2P</div><div class="use">Scores · ranks · timers</div></div>
    <div class="samp-pixel">SCORE 1280</div>
  </div>
</div>
</body>
</html>
