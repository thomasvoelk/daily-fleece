<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); }
  .wrap { padding: 18px 24px; display: flex; flex-direction: column; gap: 11px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .tok { width: 96px; flex-shrink: 0; font-family: var(--font-pixel); font-size: 8px; color: var(--plum-faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="line"><span class="tok">display-xl</span><span class="t-display-xl">Daily Fleece</span></div>
  <div class="line"><span class="tok">h1</span><span class="t-h1">Today's quiz</span></div>
  <div class="line"><span class="tok">h2</span><span class="t-h2">Geography round</span></div>
  <div class="line"><span class="tok">h3</span><span class="t-h3">Pick your answer</span></div>
  <div class="line"><span class="tok">body</span><span class="t-body">Two questions a day keep the standup lively.</span></div>
  <div class="line"><span class="tok">small</span><span class="t-small">12 teammates have played today</span></div>
  <div class="line"><span class="tok">caption</span><span class="t-caption">Knowledge · Round 1</span></div>
</div>
</body>
</html>
