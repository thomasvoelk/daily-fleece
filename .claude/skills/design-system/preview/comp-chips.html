<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
<style>
  body { margin: 0; background: var(--paper); }
  .wrap { padding: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .ms { font-family: 'Material Symbols Rounded'; font-size: 18px; line-height: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; padding: 7px 14px; border-radius: var(--r-pill); font-family: var(--font-body); }
  .knowledge { background: var(--grape-200); color: var(--grape-700); }
  .geography { background: var(--teal-200); color: var(--teal-700); }
  .points { background: var(--marigold-200); color: var(--marigold-700); }
  .live { background: var(--coral); color: #fff; }
  .badge { display:inline-flex; align-items:center; justify-content:center; min-width: 26px; height: 26px; padding: 0 8px; border-radius: var(--r-pill); background: var(--coral); color:#fff; font-family: var(--font-pixel); font-size: 9px; }
  .streak { background: var(--marigold); color: var(--plum); }
</style>
</head>
<body>
<div class="wrap">
  <span class="pill knowledge"><span class="ms">psychology</span>Knowledge</span>
  <span class="pill geography"><span class="ms">public</span>Geography</span>
  <span class="pill points"><span class="ms">stars</span>+120 pts</span>
  <span class="pill live"><span class="ms">bolt</span>Live</span>
  <span class="badge">3</span>
  <span class="badge streak">x7</span>
</div>
</body>
</html>
