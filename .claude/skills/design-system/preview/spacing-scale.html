<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); }
  .wrap { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .bar { height: 16px; background: var(--teal); border-radius: 4px; }
  .tok { width: 44px; font-family: var(--font-pixel); font-size: 8px; color: var(--plum); }
  .px { font-size: 11px; color: var(--plum-faint); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="tok">sp-1</span><div class="bar" style="width:4px"></div><span class="px">4</span></div>
  <div class="row"><span class="tok">sp-2</span><div class="bar" style="width:8px"></div><span class="px">8</span></div>
  <div class="row"><span class="tok">sp-3</span><div class="bar" style="width:12px"></div><span class="px">12</span></div>
  <div class="row"><span class="tok">sp-4</span><div class="bar" style="width:16px"></div><span class="px">16</span></div>
  <div class="row"><span class="tok">sp-6</span><div class="bar" style="width:24px"></div><span class="px">24</span></div>
  <div class="row"><span class="tok">sp-8</span><div class="bar" style="width:32px"></div><span class="px">32</span></div>
  <div class="row"><span class="tok">sp-12</span><div class="bar" style="width:48px"></div><span class="px">48</span></div>
  <div class="row"><span class="tok">sp-16</span><div class="bar" style="width:64px"></div><span class="px">64</span></div>
</div>
</body>
</html>
