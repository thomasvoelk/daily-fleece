<mat-form-field class="w-full">
  @if (correctCountryMode()) {
    <mat-label i18n="quiz|Label for the host correct-country input@@quiz.countryCorrectLabel"
      >Correct country</mat-label
    >
  } @else {
    <mat-label
      i18n="quiz|Label for the player's own country answer input@@quiz.countryYourAnswerLabel"
      >Your answer</mat-label
    >
  }
  <input
    type="text"
    matInput
    [matAutocomplete]="auto"
    [value]="inputValue()"
    (input)="onInput($any($event.target).value)"
  />
  <mat-autocomplete #auto (optionSelected)="onSelect($event)">
    @for (country of filteredCountries(); track country.code) {
      <mat-option [value]="country.code">{{ country.name }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
