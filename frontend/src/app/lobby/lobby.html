<main class="min-h-screen p-4">
  <div class="max-w-sm mx-auto mt-8">
    <h1 class="text-xl font-bold mb-4" i18n="lobby|Heading for the waiting room@@lobby.heading">
      Today's Session
    </h1>
    <ul
      class="divide-y"
      i18n-aria-label="lobby|Accessible label for the player list@@lobby.playerListAriaLabel"
      aria-label="Players in session"
    >
      @for (player of store.session()?.players ?? []; track player.playerId) {
        <li class="py-2">{{ player.displayName }}</li>
      }
    </ul>
    <div class="flex gap-2 mt-4">
      <button
        (click)="store.refresh()"
        class="border rounded px-4 py-2"
        i18n="lobby|Button to reload the player list@@lobby.refreshButton"
      >
        Refresh
      </button>
      @if (store.isHost()) {
        <button
          (click)="store.startQuiz()"
          class="bg-blue-600 text-white rounded px-4 py-2"
          i18n="lobby|Button for host to start the quiz@@lobby.startQuizButton"
        >
          Start Quiz
        </button>
      }
    </div>
    <p class="mt-2 text-sm text-red-600" role="alert" aria-live="assertive">
      {{ store.refreshError() ?? '' }}
    </p>
  </div>
</main>
