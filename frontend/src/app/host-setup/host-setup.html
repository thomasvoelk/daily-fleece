<main class="min-h-svh bg-cream p-6">
  <form
    class="mx-auto mt-8 flex max-w-sm flex-col gap-5"
    (submit)="$event.preventDefault()"
    novalidate
  >
    <h1 class="text-[28px]" i18n="hostSetup|Heading on the host setup screen@@hostSetup.heading">
      Host Setup
    </h1>

    <div class="flex flex-col gap-2 rounded-2xl border-2 border-wool-line bg-paper p-4">
      <label
        for="q1"
        class="font-body text-sm font-extrabold tracking-wide text-plum-soft uppercase"
        i18n="hostSetup|Label for the Q1 file picker@@hostSetup.q1Label"
      >
        Q1 — Knowledge (calendar page)
      </label>
      <input id="q1" type="file" accept="image/*" (change)="onQ1Change($event)" />
      @if (q1Preview()) {
        <img
          [src]="q1Preview()"
          alt="Q1 photo preview"
          i18n-alt="hostSetup|Alt text for Q1 photo preview@@hostSetup.q1PreviewAlt"
          class="mt-1 max-h-40 rounded-lg object-contain"
        />
      }
    </div>

    <div class="flex flex-col gap-2 rounded-2xl border-2 border-wool-line bg-paper p-4">
      <label
        for="q2"
        class="font-body text-sm font-extrabold tracking-wide text-plum-soft uppercase"
        i18n="hostSetup|Label for the Q2 file picker@@hostSetup.q2Label"
      >
        Q2 — Geography (location)
      </label>
      <input id="q2" type="file" accept="image/*" (change)="onQ2Change($event)" />
      @if (q2Preview()) {
        <img
          [src]="q2Preview()"
          alt="Q2 photo preview"
          i18n-alt="hostSetup|Alt text for Q2 photo preview@@hostSetup.q2PreviewAlt"
          class="mt-1 max-h-40 rounded-lg object-contain"
        />
      }
    </div>

    @if (store.phase() === 'error') {
      <p class="text-sm text-coral-700" role="alert" aria-live="assertive">
        {{ store.errorMessage() }}
      </p>
    } @else {
      <p role="alert" aria-live="assertive" class="hidden"></p>
    }

    <button
      mat-flat-button
      type="button"
      disabledInteractive
      (click)="store.createSession()"
      [disabled]="!store.canSubmit()"
      i18n="hostSetup|Button to create a session@@hostSetup.createSessionButton"
    >
      Create Session
    </button>
  </form>
</main>
