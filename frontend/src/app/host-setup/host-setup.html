<main class="min-h-screen p-4">
  <form
    class="flex flex-col gap-4 max-w-sm mx-auto mt-8"
    (submit)="$event.preventDefault()"
    novalidate
  >
    <h1
      class="text-xl font-bold"
      i18n="hostSetup|Heading on the host setup screen@@hostSetup.heading"
    >
      Host Setup
    </h1>

    <div class="flex flex-col gap-2">
      <label for="q1" i18n="hostSetup|Label for the Q1 file picker@@hostSetup.q1Label">
        Q1 — Knowledge (calendar page)
      </label>
      <input id="q1" type="file" accept="image/*" (change)="onQ1Change($event)" />
      @if (q1Preview()) {
        <img
          [src]="q1Preview()"
          alt=""
          class="mt-1 max-h-40 object-contain"
          i18n-alt="hostSetup|Alt text for Q1 preview@@hostSetup.q1PreviewAlt"
        />
      }
    </div>

    <div class="flex flex-col gap-2">
      <label for="q2" i18n="hostSetup|Label for the Q2 file picker@@hostSetup.q2Label">
        Q2 — Geography (location)
      </label>
      <input id="q2" type="file" accept="image/*" (change)="onQ2Change($event)" />
      @if (q2Preview()) {
        <img
          [src]="q2Preview()"
          alt=""
          class="mt-1 max-h-40 object-contain"
          i18n-alt="hostSetup|Alt text for Q2 preview@@hostSetup.q2PreviewAlt"
        />
      }
    </div>

    @if (store.phase() === 'error') {
      <p role="alert" aria-live="assertive">
        {{ store.errorMessage() }}
      </p>
    } @else {
      <p role="alert" aria-live="assertive" class="hidden"></p>
    }

    <button
      mat-flat-button
      type="button"
      (click)="store.createSession()"
      [disabled]="!store.canSubmit()"
      i18n="hostSetup|Button to create a session@@hostSetup.createSessionButton"
    >
      Create Session
    </button>
  </form>
</main>
