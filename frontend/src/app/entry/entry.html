<main class="flex min-h-svh flex-col items-center justify-center bg-cream p-6">
  <form class="flex w-full max-w-sm flex-col gap-4" (submit)="$event.preventDefault()" novalidate>
    <div class="mb-2 flex flex-col items-center gap-3">
      <img
        src="/alpaca-mark.svg"
        alt=""
        width="80"
        height="80"
        class="rounded-[22px] motion-safe:animate-pop"
      />
      <h1
        class="text-center text-[32px] leading-tight font-bold tracking-tight"
        i18n="entry|Heading on the entry screen@@entry.heading"
      >
        Daily Fleece
      </h1>
      <p
        class="-mt-2 text-center font-body text-sm font-semibold text-plum-faint"
        i18n="entry|Tagline below the heading on the entry screen@@entry.tagline"
      >
        Two questions. Every standup.
      </p>
    </div>

    <mat-form-field appearance="outline">
      <mat-label i18n="entry|Label for the Company ID input@@entry.companyIdLabel"
        >Company ID</mat-label
      >
      <input matInput [formField]="entryForm.companyId" />
      @for (err of entryForm.companyId().errors(); track $index) {
        <mat-error>{{ err.message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="entry|Label for the Display name input@@entry.displayNameLabel"
        >Display name</mat-label
      >
      <input matInput [formField]="entryForm.displayName" />
      @for (err of entryForm.displayName().errors(); track $index) {
        <mat-error>{{ err.message }}</mat-error>
      }
    </mat-form-field>

    <p class="min-h-5 text-center text-sm text-coral-700" role="alert" aria-live="assertive">
      {{ store.phase() === 'error' ? store.errorMessage() : '' }}
    </p>

    <button
      type="button"
      (click)="onJoinLobby()"
      [disabled]="store.phase() === 'loading'"
      class="duration-fast w-full cursor-pointer rounded-full border-0 bg-grape px-6 py-[15px] font-display text-[17px] font-semibold text-white shadow-chunk-grape transition-[transform,box-shadow] ease-smooth tap-transparent active:translate-y-[5px] active:shadow-chunk-grape-pressed disabled:opacity-50"
      i18n="entry|Button to join an existing lobby@@entry.joinLobbyButton"
    >
      Join Lobby
    </button>
    <button
      type="button"
      (click)="onCreateLobby()"
      [disabled]="store.phase() === 'loading'"
      class="w-full cursor-pointer rounded-full border-2 border-grape bg-transparent px-5 py-[11px] font-display text-[14px] font-semibold text-grape tap-transparent disabled:opacity-50"
      i18n="entry|Button to create a new lobby@@entry.createLobbyButton"
    >
      Create Lobby
    </button>
  </form>
</main>
