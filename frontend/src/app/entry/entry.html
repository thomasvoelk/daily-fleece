<main class="flex min-h-svh flex-col items-center justify-center bg-cream p-6">
  <form class="flex w-full max-w-sm flex-col gap-4" (submit)="$event.preventDefault()" novalidate>
    <h1
      class="mb-2 text-center text-4xl leading-tight"
      i18n="entry|Heading on the entry screen@@entry.heading"
    >
      Daily Fleece
    </h1>

    <mat-form-field appearance="outline">
      <mat-label i18n="entry|Label for the Company ID input@@entry.companyIdLabel"
        >Company ID</mat-label
      >
      <input matInput [formField]="entryForm.companyId" />
      @for (err of entryForm.companyId().errors(); track $index) {
        <mat-error>{{ err.message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="entry|Label for the Display name input@@entry.displayNameLabel"
        >Display name</mat-label
      >
      <input matInput [formField]="entryForm.displayName" />
      @for (err of entryForm.displayName().errors(); track $index) {
        <mat-error>{{ err.message }}</mat-error>
      }
    </mat-form-field>

    <p class="min-h-5 text-center text-sm text-coral-700" role="alert" aria-live="assertive">
      {{ store.phase() === 'error' ? store.errorMessage() : '' }}
    </p>

    <div class="flex gap-3">
      <button
        mat-flat-button
        type="button"
        (click)="onJoinLobby()"
        [disabled]="store.phase() === 'loading'"
        class="flex-1"
        i18n="entry|Button to join an existing lobby@@entry.joinLobbyButton"
      >
        Join Lobby
      </button>
      <button
        mat-flat-button
        type="button"
        (click)="onCreateLobby()"
        [disabled]="store.phase() === 'loading'"
        class="flex-1"
        i18n="entry|Button to create a new lobby@@entry.createLobbyButton"
      >
        Create Lobby
      </button>
    </div>
  </form>
</main>
